# Config Python de SOCIAL-PIP — solo cubre los auxiliares en skills/*/scripts/.
# El producto runtime es TS/Rust (ver package.json). Este archivo declara las
# tooling settings (ruff/pytest) que ya existen como ruff.toml / pytest.ini de
# forma retro-compatible, y hace el "paquete" instalable no obstante sea un
# conjunto de scripts sueltos.
#
# La config real de lint/test vive en ruff.toml y pytest.ini (fuente de verdad);
# aqui no se duplican reglas para evitar drift.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-pip"
version = "0.1.0"
description = "Scripts Python auxiliares de Social-Pip (orquestador de agentes, contenido SEO, API validation)."
readme = "README.md"
requires-python = ">=3.11"
# Dependencias runtime minimas; los extras opcionales van en requirements.txt
# (fastapi/uvicorn/pydantic[email] para el template REST, numpy, pyyaml).
dependencies = []

[project.optional-dependencies]
# Template REST API (skills/20-PLATFORM/api-design-principles/assets)
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic[email]>=2.6"]
# Optimizador de prompts (skills/50-AI/prompt-engineering-patterns/scripts)
optimize = ["numpy==1.26.4"]
# Registry scan (skills/50-AI/agent-orchestrator/scripts)
orchestrator = ["pyyaml==6.0.3"]
# Todo junto + tooling de desarrollo (ruff/pytest ya configurados)
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[tool.setuptools]
# Sin paquetes que instalar: scripts sueltos bajo skills/. Declarado vacio
# a proposito; la instalacion `pip install -e .` no expone modulos importables.
packages = []