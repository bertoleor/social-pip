[pytest]
# Pytest config — SOCIAL-PIP (suite python de auxiliares en skills/*/scripts/)
# Evita el scan de node_modules que colgaba pytest a raíz del repo.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Scoped: nada de node_modules / .git / vault
norecursedirs = node_modules .git target dist build skills/99-VAULT

# No usar cacheprovider en CI (evita escrituras fuera de scope)
addopts = -p no:cacheprovider -q