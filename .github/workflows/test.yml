name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.coverage.outputs.lines }}
      branches: ${{ steps.coverage.outputs.branches }}
      functions: ${{ steps.coverage.outputs.functions }}
      passed: ${{ steps.coverage.outputs.passed }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      id: pnpm-cache

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run TypeScript check
      run: pnpm typecheck

    - name: Run linting
      run: pnpm lint

    - name: Run tests with coverage
      run: pnpm test -- --coverage
      env:
        NODE_OPTIONS: "--max-old-space-size=8192"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: apps/desktop/coverage/
        retention-days: 7

    - name: Calculate coverage and check thresholds
      id: coverage
      run: |
        cd apps/desktop
        COVERAGE_JSON=$(cat coverage/coverage-final.json)

        LINES=$(echo "$COVERAGE_JSON" | node -e "
        const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
        let total = 0, covered = 0;
        Object.values(data).forEach(file => {
          Object.values(file.l || {}).forEach(hit => {
            total++;
            if (hit > 0) covered++;
          });
        });
        console.log(total > 0 ? (covered / total * 100).toFixed(2) : 0);
        ")

        BRANCHES=$(echo "$COVERAGE_JSON" | node -e "
        const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
        let total = 0, covered = 0;
        Object.values(data).forEach(file => {
          Object.values(file.b || {}).forEach(branch => {
            if (Array.isArray(branch)) {
              branch.forEach(hit => {
                total++;
                if (hit > 0) covered++;
              });
            }
          });
        });
        console.log(total > 0 ? (covered / total * 100).toFixed(2) : 0);
        ")

        FUNCTIONS=$(echo "$COVERAGE_JSON" | node -e "
        const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
        let total = 0, covered = 0;
        Object.values(data).forEach(file => {
          Object.values(file.f || {}).forEach(hit => {
            total++;
            if (hit > 0) covered++;
          });
        });
        console.log(total > 0 ? (covered / total * 100).toFixed(2) : 0);
        ")

        echo "lines=$LINES" >> $GITHUB_OUTPUT
        echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
        echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT

        echo "Coverage: Lines=$LINES%, Branches=$BRANCHES%, Functions=$FUNCTIONS%"

        PASS=true

        if (( $(echo "$LINES < 80" | bc -l) )); then
          echo "::error::Lines coverage $LINES% is below threshold 80%"
          PASS=false
        fi

        if (( $(echo "$BRANCHES < 75" | bc -l) )); then
          echo "::error::Branches coverage $BRANCHES% is below threshold 75%"
          PASS=false
        fi

        if (( $(echo "$FUNCTIONS < 85" | bc -l) )); then
          echo "::error::Functions coverage $FUNCTIONS% is below threshold 85%"
          PASS=false
        fi

        if [ "$PASS" = true ]; then
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "All coverage thresholds passed!"
        else
          echo "passed=false" >> $GITHUB_OUTPUT
          exit 1
        fi

  coverage-comment:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
    - name: Add coverage PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const lines = '${{ needs.test.outputs.lines }}';
          const branches = '${{ needs.test.outputs.branches }}';
          const functions = '${{ needs.test.outputs.functions }}';
          const passed = '${{ needs.test.outputs.passed }}';

          const linesIcon = parseFloat(lines) >= 80 ? '✅' : '❌';
          const branchesIcon = parseFloat(branches) >= 75 ? '✅' : '❌';
          const functionsIcon = parseFloat(functions) >= 85 ? '✅' : '❌';

          const statusEmoji = passed === 'true' ? '✅' : '❌';
          const statusText = passed === 'true' ? 'All thresholds passed!' : 'Some thresholds not met';

          const body = `## 📊 Coverage Report

          | Metric | Coverage | Threshold | Status |
          |--------|----------|-----------|--------|
          | **Lines** | ${lines}% | 80% | ${linesIcon} |
          | **Branches** | ${branches}% | 75% | ${branchesIcon} |
          | **Functions** | ${functions}% | 85% | ${functionsIcon} |

          ### ${statusEmoji} ${statusText}
          `;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Coverage Report')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scasbom:
    name: Trivy SCA/SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasec/trivy-action@master
        with:
          scan-type: fs
          path: .
          exit-code: 1
          ignore-unfixed: true

  sast-semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
  supply-sign:
    name: SBOM sign (Sigstore keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SBOM CycloneDX
        uses: aquasec/trivy-action@master
        with:
          scan-type: fs
          path: .
          format: cyclonedx-json
          output: sbom.cdx.json
          exit-code: 0
      - name: Cosign install
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOM
        run: cosign sign-blob --yes sbom.cdx.json --output-signature sbom.cdx.sig --output-certificate sbom.cdx.pem
