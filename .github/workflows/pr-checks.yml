name: PR Checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test -- --coverage --reporter=json --reporter=default
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Generate coverage summary
        id: coverage
        run: |
          cd apps/desktop

          LINES=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const total = data.total;
            console.log(total.lines.pct.toFixed(2));
          ")

          BRANCHES=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const total = data.total;
            console.log(total.branches.pct.toFixed(2));
          ")

          FUNCTIONS=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const total = data.total;
            console.log(total.functions.pct.toFixed(2));
          ")

          STATEMENTS=$(cat coverage/coverage-summary.json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const total = data.total;
            console.log(total.statements.pct.toFixed(2));
          ")

          echo "lines=$LINES" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT

      - name: Create coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const lines = ${{ steps.coverage.outputs.lines }};
            const branches = ${{ steps.coverage.outputs.branches }};
            const functions = ${{ steps.coverage.outputs.functions }};
            const statements = ${{ steps.coverage.outputs.statements }};

            const linesIcon = lines >= 80 ? '✅' : '❌';
            const branchesIcon = branches >= 75 ? '✅' : '❌';
            const functionsIcon = functions >= 85 ? '✅' : '❌';
            const statementsIcon = statements >= 80 ? '✅' : '❌';

            const body = `## 📊 Coverage Report

            | Metric | Coverage | Threshold | Status |
            |--------|----------|-----------|--------|
            | **Lines** | ${lines}% | 80% | ${linesIcon} |
            | **Branches** | ${branches}% | 75% | ${branchesIcon} |
            | **Functions** | ${functions}% | 85% | ${functionsIcon} |
            | **Statements** | ${statements}% | 80% | ${statementsIcon} |

            ${lines >= 80 && branches >= 75 && functions >= 85 && statements >= 80 
              ? '### ✅ All coverage thresholds passed!' 
              : '### ❌ Coverage thresholds not met. Please add more tests.'}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issueNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issueNumber,
                body: body
              });
            }

      - name: Check coverage thresholds
        run: |
          LINES=${{ steps.coverage.outputs.lines }}
          BRANCHES=${{ steps.coverage.outputs.branches }}
          FUNCTIONS=${{ steps.coverage.outputs.functions }}
          STATEMENTS=${{ steps.coverage.outputs.statements }}

          PASS=true

          if (( $(echo "$LINES < 80" | bc -l) )); then
            echo "::error::Lines coverage $LINES% is below threshold 80%"
            PASS=false
          fi

          if (( $(echo "$BRANCHES < 75" | bc -l) )); then
            echo "::error::Branches coverage $BRANCHES% is below threshold 75%"
            PASS=false
          fi

          if (( $(echo "$FUNCTIONS < 85" | bc -l) )); then
            echo "::error::Functions coverage $FUNCTIONS% is below threshold 85%"
            PASS=false
          fi

          if (( $(echo "$STATEMENTS < 80" | bc -l) )); then
            echo "::error::Statements coverage $STATEMENTS% is below threshold 80%"
            PASS=false
          fi

          if [ "$PASS" = false ]; then
            exit 1
          fi

  sast-semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
  supply-sign:
    name: SBOM sign (Sigstore keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SBOM CycloneDX
        uses: aquasec/trivy-action@master
        with:
          scan-type: fs
          path: .
          format: cyclonedx-json
          output: sbom.cdx.json
          exit-code: 0
      - name: Cosign install
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOM
        run: cosign sign-blob --yes sbom.cdx.json --output-signature sbom.cdx.sig --output-certificate sbom.cdx.pem

  python-deps-audit:
    name: Python deps audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit pinned aux python deps
        # Audita requirements.txt (numpy/pyyaml pineados con ==, ver hallazgo DP-08)
        run: pip-audit -r requirements.txt

  pnpm-audit:
    name: JS deps audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      # DP-07: gate supply-chain en PR temprano. Fallo rapido si hay dependencias
      # con advisory HIGH/CRITICAL en el lockfile (npm registry audit endpoint).
      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level=high
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}