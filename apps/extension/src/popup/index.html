<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social-Pip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #0f172a; color: #e2e8f0; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .logo { width: 24px; height: 24px; background: #3b82f6; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .status { padding: 8px 12px; background: #1e293b; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .status.connected { border-left: 3px solid #22c55e; }
    .status.disconnected { border-left: 3px solid #ef4444; }
    .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #1e293b; color: #94a3b8; }
    .btn-secondary:hover { background: #334155; }
    .version { text-align: center; font-size: 11px; color: #64748b; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📌</div>
    <h1>Social-Pip</h1>
  </div>
  <div id="status" class="status disconnected">Verificando conexión...</div>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="open-app">Abrir Social-Pip</button>
    <button type="button" class="btn btn-secondary" id="open-dashboard">Ver Dashboard</button>
  </div>
  <div class="version">Social-Pip Extension v1.0.0</div>

  <script src="./index.ts" type="module"></script>
</body>
</html>
